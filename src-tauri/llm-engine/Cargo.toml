[package]
name = "sayit-llm-engine"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "sayit-llm"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
llama-cpp-sys-2 = { version = "0.1.161", default-features = false, features = ["vulkan"] }

# Apple 平台上 llama.cpp 默认启用 Metal 并内嵌着色器库，不需要额外特性。
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-sys-2 = { version = "0.1.161", default-features = false }
