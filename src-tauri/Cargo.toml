[package]
name = "say-it"
version = "0.4.0"
description = "说吧！"
authors = ["痕继痕迹"]
license = ""
repository = ""
edition = "2021"
default-run = "say-it"
autobins = false

[[bin]]
name = "say-it"
path = "src/main.rs"

[[bin]]
name = "build_model_pack"
path = "src/bin/build_model_pack.rs"
required-features = ["model-pack-builder"]

[build-dependencies]
tauri-build = { version = "2.0.1", features = [] }
sherpa-onnx-sys = { version = "1.13.5", default-features = false, features = ["shared"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[patch.crates-io]
ocr-rs = { path = "vendor/ocr-rs" }

[dependencies]
aes-gcm = "0.10"
base64 = "0.22.1"
ed25519-dalek = { version = "2.2", features = ["pem"] }
futures-util = "0.3.31"
fs2 = "0.4"
axum = { version = "0.8.9", features = ["ws"] }
obws = "0.15.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sherpa-onnx = { version = "1.13.5", default-features = false, features = ["shared"] }
rustls = { version = "0.23.37", features = ["ring"] }
tauri = { version = "2.10.3", features = ["tray-icon", "protocol-asset", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["net", "sync", "time", "process", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "rustls-tls", "gzip", "json", "stream", "http2", "multipart"] }
enigo = "0.3"
arboard = "3"
cpal = "0.15"
nnnoiseless = "0.5"
ebur128 = "0.1"
symphonia = { version = "0.6.0", features = ["mp3", "aac", "isomp4", "ogg"] }
audiopus = "0.2.0"
ogg-opus = "0.1.2"
mp3lame-encoder = "0.2.4"
once_cell = "1.20"
fancy-regex = "0.14"
genai = "0.7.0-beta.13"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
rquickjs = { version = "0.12.1", features = ["futures", "loader", "macro"] }
rusqlite = { version = "0.32", features = ["bundled"] }
hmac = "0.12"
rand = "0.9"
zeroize = "1"
tauri-plugin-global-shortcut = "2"
window-vibrancy = "0.6"

[target.'cfg(windows)'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
ocr-rs = { version = "=2.3.2", default-features = false, features = ["mnn-static"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_DataExchange",
    "Win32_System_WinRT",
    "Win32_UI_Accessibility",
    "Win32_UI_Input",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Storage_FileSystem",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Foundation_Collections",
] }
winreg = "0.52"

[target.'cfg(target_os = "macos")'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
ocr-rs = { version = "=2.3.2", default-features = false }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
model-pack-builder = []

[dev-dependencies]
ogg = "0.8.0"

# 保留开发态栈回溯所需的调试信息，同时避免 macOS 默认的 unpacked
# 模式为每个编译单元长期累积大量独立对象文件。
[profile.dev]
debug = 1
split-debuginfo = "packed"
