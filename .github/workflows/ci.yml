name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install macOS native dependency
        if: runner.os == 'macOS'
        run: brew install opus
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ui
      - run: npm run ui:build
      - run: npm run test:rust
      - name: Build and test Windows context probe
        if: runner.os == 'Windows'
        run: npm run context-probe:build && npm run context-probe:test
