name: Build macOS 15

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            asset_arch: arm64
            expected_arch: arm64
          - runner: macos-15-intel
            asset_arch: x64
            expected_arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.expected_arch }}

      - name: install native and frontend dependencies
        run: |
          brew install opus
          npm install

      - name: build binary without bundling
        run: |
          npm run context-probe:build
          npm run macos-speech:build
          node scripts/run-tauri.mjs build --no-bundle

      - name: retarget bundled ONNX Runtime to macOS 15.0
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r lib; do
            found=1
            echo "retarget: $lib"
            vtool -show-build "$lib" | grep -E 'platform|minos' || true
            vtool -set-build-version macos 15.0 15.0 -output "$lib.retargeted" "$lib"
            mv "$lib.retargeted" "$lib"
            vtool -show-build "$lib" | grep -E 'platform|minos' || true
          done < <(find src-tauri/target -name 'libonnxruntime*.dylib' -type f)
          test "$found" -eq 1

      - name: build macOS disk image
        run: node scripts/run-tauri.mjs build --bundles app dmg

      - name: validate macOS bundle
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          set -euo pipefail
          app_path="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          binary="$app_path/Contents/MacOS/SayIt"
          test "$(lipo -archs "$binary")" = "$EXPECTED_ARCH"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          otool -L "$binary" | grep -q '@rpath/libsherpa-onnx-c-api.dylib'
          otool -L "$binary" | grep -q '@rpath/libonnxruntime.dylib'
          test -f "$app_path/Contents/Frameworks/libsherpa-onnx-c-api.dylib"
          test -f "$app_path/Contents/Frameworks/libonnxruntime.dylib"
          test -x "$app_path/Contents/MacOS/sayit-apple-speech"
          test "$(plutil -extract LSMinimumSystemVersion raw -o - "$app_path/Contents/Info.plist")" = "15.0"
          EXPECTED_ARCH="$EXPECTED_ARCH" node scripts/validate-macos-bundle.mjs "$app_path"
          plutil -extract NSMicrophoneUsageDescription raw -o - "$app_path/Contents/Info.plist" >/dev/null
          plutil -extract NSSpeechRecognitionUsageDescription raw -o - "$app_path/Contents/Info.plist" >/dev/null
          plutil -extract NSScreenCaptureUsageDescription raw -o - "$app_path/Contents/Info.plist" >/dev/null

      - name: normalize macOS asset name
        env:
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          bundle_dir="src-tauri/target/release/bundle/dmg"
          shopt -s nullglob
          images=("$bundle_dir"/*.dmg)
          test "${#images[@]}" -eq 1
          mv "${images[0]}" "$bundle_dir/SayIt_${version}_macos15_${ASSET_ARCH}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: sayit-macos15-${{ matrix.asset_arch }}
          path: src-tauri/target/release/bundle/dmg/SayIt_*_macos15_${{ matrix.asset_arch }}.dmg
          if-no-files-found: error
